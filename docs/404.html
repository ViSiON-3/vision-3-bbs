<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>NO CARRIER — ViSiON/3 BBS</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        .nc-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .nc-box {
            max-width: 46rem;
            width: 100%;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            padding: 2rem;
        }
        .nc-box pre {
            color: var(--blue-bright);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            line-height: 1.3;
            margin: 0 0 1.5rem;
            overflow-x: auto;
        }
        .nc-box h1 {
            color: var(--text-heading);
            font-family: var(--font-mono);
            font-size: 1.25rem;
            margin: 0 0 1rem;
        }
        .nc-box p {
            color: var(--text-secondary);
            margin: 0 0 1.5rem;
        }
        .nc-links a {
            color: var(--cyan-accent);
            margin-right: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="nc-wrap">
        <div class="nc-box">
<pre>ATDT 1-314-555-0100
CONNECT 2400
NO CARRIER</pre>
            <h1>404 &mdash; that page isn't here.</h1>
            <p>The address you asked for doesn't exist on this board. It may have
               moved, or it may never have been here at all.</p>
            <div class="nc-links">
                <a href="/">[H] Home</a>
                <a href="/sysop/">[D] Sysop Docs</a>
                <a href="https://github.com/ViSiON-3/vision-3-bbs">[G] GitHub</a>
            </div>
        </div>
    </div>
</body>
</html>
