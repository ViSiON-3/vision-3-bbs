name: govulncheck

# Known vulnerabilities in the Go modules and standard library that the code
# actually reaches (https://go.dev/doc/security/vuln). Separate from CI so a
# newly published vulnerability fails this check, not every pull request: it
# runs on main, weekly (the database changes without any commit here), on
# pull requests that change the modules, and by hand.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - go.mod
      - go.sum
      - .github/workflows/govulncheck.yml
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The newest patch release of the Go line go.mod names: the standard
      # library a sysop building today gets, and the one govulncheck checks.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          check-latest: true
      # govulncheck v1.7.0 is the newest that runs on Go 1.25 (v1.8.0 needs
      # Go 1.26). Move both together when go.mod moves.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
