name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^third_party/' || true)
          if [ -n "$unformatted" ]; then
            echo "gofmt required on:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      # The legacy baseline (~131 issues on 2026-07-15) is gone as of #349, so
      # this is a full run that gates pushes to main as well as PRs. Keep it
      # that way: only-new-issues needs a PR patch and would silently skip main.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8

      # Every 32-bit released target: the 386 builds run on 32-bit Windows and
      # armv7 is the Raspberry Pi 2/3 bundle. On all of them a 64-bit atomic on
      # a struct field that is not 8-byte aligned panics at first use with
      # "unaligned 64-bit atomic operation". 0.9.0 and 0.9.1 shipped with one
      # in the editor's input handler, so every telnet connect on Windows 10
      # 32-bit died at the matrix screen (#354 hit the same panic over SSH on
      # armv7 with 0.9.2). No 64-bit build, vet, or test can see it: the field
      # is aligned on amd64/arm64. staticcheck's SA1027 finds it, but only
      # while analysing a 32-bit target, which the step above never does. Both
      # OSes, since windows-tagged files are only analysed under GOOS=windows.
      # Runs on main too: it has no baseline to hide behind.
      - name: golangci-lint linux/386 (64-bit atomic alignment)
        uses: golangci/golangci-lint-action@v8
        with:
          args: --config .golangci-32bit.yml
        env:
          GOOS: linux
          GOARCH: "386"
      - name: golangci-lint windows/386 (64-bit atomic alignment)
        uses: golangci/golangci-lint-action@v8
        with:
          args: --config .golangci-32bit.yml
        env:
          GOOS: windows
          GOARCH: "386"
      - name: golangci-lint linux/arm (64-bit atomic alignment)
        uses: golangci/golangci-lint-action@v8
        with:
          args: --config .golangci-32bit.yml
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: "7"

  # Windows is a released platform (README: "Windows x86_64 Released") and now
  # gates like Linux does. It went untested for a long time, and turning it on
  # found four product bugs at once: FTN mail could not start there at all
  # (#248), a concurrent read made every users.json save fail (#249), a path
  # ending in "/" gained a second separator, and ziplab held its own source
  # file open while renaming over it. None was visible from a Linux run, a
  # GOOS=windows build, or vet. See #235.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Temporary, Windows only. Four Windows jobs lost the runner with no logs,
      # and GitHub's message lists CPU or memory starvation as one possible cause
      # (#814). This samples free memory and the top processes every 30s, and the
      # stop step at the end of this job prints the samples.
      #
      # It shows what a healthy job uses, not what killed a lost one. A lost job
      # never reaches the stop step and its VM is gone. A deliberately killed
      # runner kept no logs, not even from finished steps, and no annotations;
      # only an artifact uploaded by an earlier step survived. Samples from the
      # step that dies can't reach an artifact with these limits, since a run
      # step has no artifact token. Remove both steps once #814 is settled.
      - name: Start resource logger
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          Set-Content "$env:RUNNER_TEMP/resource-logger.ps1" @'
          param($log)
          # 4 hours at most, in case the stop step never runs.
          foreach ($i in 1..480) {
            try {
              $os = Get-CimInstance Win32_OperatingSystem
              $procs = Get-Process
              $mem = $procs | Sort-Object WorkingSet64 -Descending | Select-Object -First 5 |
                ForEach-Object { '{0}={1}MB' -f $_.ProcessName, [int]($_.WorkingSet64 / 1MB) }
              $cpu = $procs | Sort-Object CPU -Descending | Select-Object -First 5 |
                ForEach-Object { '{0}={1}s' -f $_.ProcessName, [int]$_.CPU }
              Add-Content $log ('{0:u} free={1}MB commit_free={2}MB mem: {3} cpu_total: {4}' -f (Get-Date).ToUniversalTime(),
                [int]($os.FreePhysicalMemory / 1KB), [int]($os.FreeVirtualMemory / 1KB), ($mem -join ' '), ($cpu -join ' '))
            } catch { Add-Content $log "sample failed: $_" }
            Start-Sleep 30
          }
          '@
          # Not Start-Process: its child was gone by the next step on the runner.
          $cmd = '"{0}" -NoProfile -WindowStyle Hidden -File "{1}\resource-logger.ps1" "{1}\resources.log"' -f (Get-Command pwsh).Source, $env:RUNNER_TEMP
          $logger = Invoke-CimMethod Win32_Process -MethodName Create -Arguments @{ CommandLine = $cmd }
          "logger pid $($logger.ProcessId), return value $($logger.ReturnValue)"
          Set-Content "$env:RUNNER_TEMP/resource-logger.pid" $logger.ProcessId
      # Windows only: the lint job already vets on Linux, and a Linux vet never
      # analyses the windows-tagged files anyway, since the build constraints
      # exclude them. This is their first vet coverage.
      - name: go vet
        if: matrix.os == 'windows-latest'
        run: go vet ./...
      # internal/menu alone takes 3-6 minutes on a Windows runner, so a slow
      # runner can pass go test's default 10-minute timeout (#792).
      - name: go test
        if: matrix.os != 'ubuntu-latest'
        run: go test -timeout 20m ./...
      - name: Native script-store ACL regression
        run: go test -v ./internal/scripting -run '^TestDataStoreCustomized(D)?ACLRejectsUpdates$' -count=1
        env:
          VISION_REQUIRE_DATA_ACL: "1"
      # Same run on Linux, with a coverage profile. The floor is a ratchet on
      # internal/ only; see scripts/coverage-check.sh for why and how to raise it.
      - name: go test (coverage)
        if: matrix.os == 'ubuntu-latest'
        run: go test -coverprofile=coverage.out ./...
      - name: Coverage floor
        if: matrix.os == 'ubuntu-latest'
        run: scripts/coverage-check.sh coverage.out
      - name: go test -race
        run: go test -race -timeout 20m ./...
      # The vendored forks under third_party/ are separate modules (wired in
      # with replace directives), so ./... above never reaches them. The
      # bubbletea fork carries local changes with their own tests (shifted
      # F-key decoding, #476); run them here on both OSes, since it has
      # Windows-only key handling too.
      - name: vendored modules (vet, test)
        shell: bash
        run: |
          for m in third_party/*/; do
            echo "::group::$m"
            (cd "$m" && go vet ./... && go test ./...) || exit 1
            echo "::endgroup::"
          done
      - name: Stop resource logger
        if: always() && matrix.os == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          $id = Get-Content "$env:RUNNER_TEMP/resource-logger.pid"
          "logger still running: $([bool](Get-Process -Id $id -ErrorAction SilentlyContinue))"
          Stop-Process -Id $id -Force -ErrorAction SilentlyContinue
          Get-Content "$env:RUNNER_TEMP/resources.log" -ErrorAction SilentlyContinue

  # Script-store replacement inspects native ACLs on every released OS.
  # Linux and Windows are covered above; macOS needs its own native run.
  scripting-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Script storage vet and race tests
        run: |
          go vet ./internal/scripting ./internal/atomicfile
          go test -race -v ./internal/scripting ./internal/atomicfile

  # The Docker image went unbuildable for ~6 months: go.mod moved to go 1.25.0
  # (a78bfce) while the Dockerfile stayed on golang:1.24-alpine, and the official
  # golang images pin GOTOOLCHAIN=local, so `go mod download` failed outright
  # instead of fetching a newer toolchain. Nothing in CI built the image, so two
  # releases shipped with a broken container. This job builds it and boots it.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Cheapest possible guard on the drift above, and the one that fails with a
      # message naming the fix rather than a toolchain error 6 layers deep.
      - name: Dockerfile base image matches go.mod
        run: |
          gomod=$(awk '/^go /{print $2; exit}' go.mod | cut -d. -f1,2)
          image=$(sed -n 's/^FROM golang:\([0-9]*\.[0-9]*\).*/\1/p' Dockerfile | head -1)
          if [ -z "$gomod" ] || [ -z "$image" ]; then
            echo "could not parse versions (go.mod='$gomod' Dockerfile='$image')"
            exit 1
          fi
          if [ "$gomod" != "$image" ]; then
            echo "Dockerfile uses golang:$image but go.mod requires go $gomod."
            echo "The official golang images set GOTOOLCHAIN=local, so the build"
            echo "will fail at 'go mod download'. Update the FROM line in Dockerfile."
            exit 1
          fi
          echo "go.mod and Dockerfile agree on Go $gomod"

      - name: Build image
        run: docker compose build

      # Compose mounts ./menus over /vision3/menus, so the boot test below would
      # still pass with the COPY menus/ layer dropped -- it would be reading the
      # checkout. Check the image itself, where a plain `docker run` looks.
      - name: Image ships the built-in menu set
        run: docker run --rm --entrypoint test vision3:latest -d /vision3/menus/v3

      # A fresh clone has no configs/ or data/, so Compose creates them as root
      # while the BBS runs as uid 100 -- the exact state a new sysop starts from.
      - name: First run from a clean state
        run: docker compose up -d

      - name: Wait for the BBS to come up
        run: |
          for _ in $(seq 1 90); do
            if docker compose logs --no-color 2>&1 | grep -q "Vision/3 BBS running"; then
              echo "BBS reported ready"
              exit 0
            fi
            state=$(docker inspect -f '{{.State.Status}}' vision3-bbs 2>/dev/null || echo gone)
            if [ "$state" = "restarting" ] || [ "$state" = "exited" ]; then
              echo "container is $state -- first run failed"
              exit 1
            fi
            sleep 2
          done
          echo "timed out waiting for the BBS to start"
          exit 1

      # Each of these fired on a real fresh install before the entrypoint learned
      # to fix volume ownership and drop privileges.
      - name: First run needed no manual intervention
        run: |
          logs=$(docker compose logs --no-color 2>&1)
          fail=0
          for pattern in "Permission denied" "\[FAIL\]" "setup.sh"; do
            if echo "$logs" | grep -q "$pattern"; then
              echo "::error::first-run log contains '$pattern'"
              fail=1
            fi
          done
          for pattern in "SSH server ready" "telnet server ready" "created default sysop account"; do
            if ! echo "$logs" | grep -q "$pattern"; then
              echo "::error::first-run log is missing '$pattern'"
              fail=1
            fi
          done
          exit $fail

      - name: Serves SSH and telnet
        run: |
          for port in 2222 2323; do
            timeout 10 bash -c "until printf '' > /dev/tcp/127.0.0.1/$port 2>/dev/null; do sleep 1; done" \
              || { echo "::error::nothing listening on $port"; exit 1; }
            echo "port $port accepting connections"
          done

      # The entrypoint starts as root to chown the mounts, then su-execs to
      # vision3. If that drop ever regresses, the BBS runs as root and silently
      # scatters root-owned files through the operator's bind mounts.
      - name: BBS dropped privileges to vision3
        run: |
          owner=$(docker compose exec -T -u vision3 vision3 sh -c "ps -o user,args | awk '/ViSiON3/ && !/awk/ {print \$1; exit}'")
          echo "ViSiON3 runs as: $owner"
          [ "$owner" = "vision3" ] || { echo "::error::expected vision3, got '$owner'"; exit 1; }

      # build.sh builds eight binaries; the Dockerfile built seven and quietly
      # omitted wfc, which has its own documented console.
      - name: Image ships every binary build.sh builds
        run: |
          expected=$(sed -n 's/.*go build -o \([A-Za-z0-9_]*\) .*/\1/p' build.sh | sort -u)
          fail=0
          for bin in $expected; do
            # build.sh writes lowercase 'vision3'; the image names it ViSiON3.
            [ "$bin" = "vision3" ] && bin=ViSiON3
            if ! docker compose exec -T -u vision3 vision3 test -x "/vision3/$bin"; then
              echo "::error::/vision3/$bin missing from the image"
              fail=1
            fi
          done
          exit $fail

      # Taking ownership of the bind-mounted checkout would leave the host user
      # unable to `git pull` or edit their own menu set.
      - name: Bind-mounted menus/ kept its host ownership
        run: |
          owner=$(stat -c %u menus)
          echo "menus/ owned by uid $owner (runner is $(id -u))"
          [ "$owner" = "$(id -u)" ] || { echo "::error::the container chowned the host's menus/"; exit 1; }

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
